<div class="login-page">

  <div class="login-card">

    <!-- LEFT VISUAL SECTION -->
    <div class="login-visual">

      <div class="purple-orb orb-1"></div>
      <div class="purple-orb orb-2"></div>
      <div class="purple-orb orb-3"></div>

      <div class="visual-overlay"></div>

      <div class="brand">
        <app-logo></app-logo>

        <div class="brand-name">
          <span>Tripledot Ai</span>
          <span class="brand-highlight">Technologies</span>
        </div>
      </div>

      <div class="visual-content">
        <p class="small-text">ACCOUNT SECURITY</p>

        <h2>
          Tripledot Ai
          <br />
          Technologies
        </h2>

        <p>
          Secure. Smart. Connected.
          <br />
          Keep your account safe with a strong password.
        </p>
      </div>

    </div>


    <!-- RIGHT FORM SECTION -->
    <div class="login-form-section">

      <div class="login-content">

        <div class="mobile-logo">
          <app-logo></app-logo>
        </div>

        <h1>Change password</h1>

        <p class="subtitle">
          Update your password to secure your account
        </p>


        <form
          class="form"
          [formGroup]="Form"
          (ngSubmit)="onSubmit()">

          <!-- OLD PASSWORD -->
          <div class="input-wrapper">

            <span class="input-icon">
              <i class="pi pi-lock"></i>
            </span>

            <p-floatlabel>

              <p-password
                name="oldPassword"
                formControlName="oldPassword"
                inputStyleClass="custom-password"
                inputId="oldPassword"
                [feedback]="false"
                [toggleMask]="true"
                autocomplete="current-password">
              </p-password>

              <label for="oldPassword">
                Old Password
              </label>

            </p-floatlabel>

            <app-field-error [control]="Form.get('oldPassword')" label="Old password" />

          </div>


          <!-- NEW PASSWORD -->
          <div class="input-wrapper">

            <span class="input-icon">
              <i class="pi pi-key"></i>
            </span>

            <p-floatlabel>

              <p-password
                name="newPassword"
                formControlName="newPassword"
                inputStyleClass="custom-password"
                inputId="newPassword"
                [feedback]="false"
                [toggleMask]="true"
                autocomplete="new-password">
              </p-password>

              <label for="newPassword">
                New Password
              </label>

            </p-floatlabel>

            <app-field-error [control]="Form.get('newPassword')" label="New password" />

          </div>


          <!-- CONFIRM PASSWORD -->
          <div class="input-wrapper">

            <span class="input-icon">
              <i class="pi pi-shield"></i>
            </span>

            <p-floatlabel>

              <p-password
                name="confirmPassword"
                formControlName="confirmPassword"
                inputStyleClass="custom-password"
                inputId="confirmPassword"
                [feedback]="false"
                [toggleMask]="true"
                autocomplete="new-password">
              </p-password>

              <label for="confirmPassword">
                Confirm Password
              </label>

            </p-floatlabel>

            <app-field-error [control]="Form.get('confirmPassword')" label="Confirm password" />

          </div>


          <!-- SUBMIT BUTTON -->
          <p-button
            label="Change Password"
            type="submit"
            [loading]="loading"
            styleClass="submit-button">
          </p-button>


          <!-- ERROR -->
          <p
            class="form-error"
            [class.visible]="errorMessage">
            {{ errorMessage }}
          </p>

        </form>


        <!-- FOOTER -->
        <div class="social-section">

          <span></span>

          <p>Secure access to your learning portal</p>

          <span></span>

        </div>

      </div>

    </div>

  </div>

</div>
