<div class="login-page">

  <div class="login-card">

    <!-- LEFT VISUAL SECTION -->
    <div class="login-visual">

      <div class="purple-orb orb-1"></div>
      <div class="purple-orb orb-2"></div>
      <div class="purple-orb orb-3"></div>

      <div class="visual-overlay"></div>

      <div class="brand">
        <app-logo></app-logo>

        <div class="brand-name">
          <span>Tripledot Ai</span>
          <span class="brand-highlight">Technologies</span>
        </div>
      </div>

      <div class="visual-content">
        <p class="small-text">ACCOUNT RECOVERY</p>

        <h2>
          Forgot Your
          <br />
          Password?
        </h2>

        <p>
          No worries, we'll send you
          <br />
          reset instructions.
        </p>
      </div>
    </div>


    <!-- RIGHT SECTION -->
    <div class="login-form-section">

      <!-- CONTENT -->
      <div class="login-content">

        <div class="mobile-logo">
          <app-logo></app-logo>
        </div>

        <h1>Forgot password</h1>

        <p class="subtitle">
          Enter your email to reset your password
        </p>


        <form
          class="form"
          [formGroup]="Form"
          (ngSubmit)="OnSubmit()">


          <!-- EMAIL -->
          <div class="input-wrapper">

            <span class="input-icon">
              <i class="pi pi-envelope"></i>
            </span>

            <p-floatlabel>

              <input
                pInputText
                formControlName="email"
                id="on_label"
                name="email"
                autocomplete="off"
                class="custom-input"
              />

              <label for="on_label">
                Email
              </label>

            </p-floatlabel>

            <app-field-error [control]="Form.get('email')" label="Email" />

          </div>


          <!-- SUBMIT -->
          <p-button
            label="Reset Password"
            type="submit"
            [loading]="loading"
            styleClass="login-button">
          </p-button>


          <!-- MESSAGE -->
          <p
            class="login-error"
            [class.visible]="message"
            [class.success]="messageType === 'success'">
            {{ message }}
          </p>

        </form>


        <!-- LINKS -->
        <div class="bottom-links">

          <a
            routerLink="/auth/login"
            class="forgot">
            Back to Login
          </a>

        </div>

      </div>

    </div>

  </div>

</div>
