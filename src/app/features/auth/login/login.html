<div class="login-page">

  <div class="login-card">

    <!-- LEFT VISUAL SECTION -->
    <div class="login-visual">

      <div class="purple-orb orb-1"></div>
      <div class="purple-orb orb-2"></div>
      <div class="purple-orb orb-3"></div>

      <div class="visual-overlay"></div>

      <div class="brand">
        <app-logo></app-logo>

        <div class="brand-name">
          <span>Tripledot Ai</span>
          <span class="brand-highlight">Technologies</span>
        </div>
      </div>

      <div class="visual-content">
        <p class="small-text">WELCOME TO</p>

        <h2>
          Tripledot Ai
          <br />
          Technologies
        </h2>

        <p>
          Secure. Smart. Connected.
          <br />
          Your learning platform starts here.
        </p>
      </div>

    </div>


    <!-- RIGHT LOGIN SECTION -->
    <div class="login-form-section">

      <!-- LOGIN CONTENT -->
      <div class="login-content">

        <div class="mobile-logo">
          <app-logo></app-logo>
        </div>

        <h1>Welcome back</h1>

        <p class="subtitle">
          Sign in to access your account
        </p>


        <form
          class="form"
          [formGroup]="Form"
          (ngSubmit)="onSubmit()">


          <!-- USERNAME / EMAIL -->
          <div class="input-wrapper">

            <span class="input-icon">
              <i class="pi pi-envelope"></i>
            </span>

            <p-floatlabel>

              <input
                pInputText
                formControlName="userNameOrEmail"
                id="username"
                name="username"
                autocomplete="off"
                class="custom-input"
                (focus)="showSuggestions = true"
                (blur)="showSuggestions = false"
                (keydown.escape)="showSuggestions = false"
              />

              <label for="username">
                Username or Email
              </label>

            </p-floatlabel>

            <!-- RECENT USERNAMES -->
            <ul
              class="suggestions"
              *ngIf="showSuggestions && filteredUsers.length">

              <li
                *ngFor="let user of filteredUsers"
                class="suggestion-item"
                (mousedown)="$event.preventDefault(); selectUser(user)">

                <i class="pi pi-user"></i>

                <span class="suggestion-text">{{ user }}</span>

                <button
                  type="button"
                  class="suggestion-remove"
                  aria-label="Remove suggestion"
                  (mousedown)="$event.preventDefault(); $event.stopPropagation(); removeUser(user)">
                  <i class="pi pi-times"></i>
                </button>

              </li>

            </ul>

          </div>


          <!-- PASSWORD -->
          <div class="input-wrapper">

            <span class="input-icon">
              <i class="pi pi-lock"></i>
            </span>

            <p-floatlabel>

              <p-password
                name="password"
                formControlName="password"
                inputStyleClass="custom-password"
                inputId="password"
                [feedback]="false"
                [toggleMask]="true"
                autocomplete="current-password">
              </p-password>

              <label for="password">
                Password
              </label>

            </p-floatlabel>

          </div>


          <!-- REMEMBER USERNAME (off by default: lab computers are shared) -->
          <label class="remember-me">
            <input type="checkbox" [checked]="rememberMe" (change)="setRememberMe($any($event.target).checked)" />
            <span>Remember my username on this device</span>
          </label>


          <!-- LOGIN BUTTON -->
          <p-button
            label="Login"
            type="submit"
            [loading]="loading"
            styleClass="login-button">
          </p-button>


          <!-- ERROR -->
          <p
            class="login-error"
            [class.visible]="errorMessage">
            {{ errorMessage }}
          </p>

        </form>


        <!-- LINKS -->
        <div class="bottom-links">

          <a
            routerLink="/auth/forgot-password"
            class="forgot">
            Forgot your password?
          </a>

          <a
            routerLink="/auth/college"
            class="forgot">
            Select College
          </a>

        </div>


        <!-- SOCIAL STYLE FOOTER -->
        <div class="social-section">

          <span></span>

          <p>Secure access to your learning portal</p>

          <span></span>

        </div>

      </div>

    </div>

  </div>

</div>
