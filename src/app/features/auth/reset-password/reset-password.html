<div class="login-page">

  <div class="login-card">

    <!-- LEFT VISUAL SECTION -->
    <div class="login-visual">

      <div class="purple-orb orb-1"></div>
      <div class="purple-orb orb-2"></div>
      <div class="purple-orb orb-3"></div>

      <div class="visual-overlay"></div>

      <div class="brand">
        <app-logo></app-logo>

        <div class="brand-name">
          <span>Tripledot Ai</span>
          <span class="brand-highlight">Technologies</span>
        </div>
      </div>

      <div class="visual-content">
        <p class="small-text">ACCOUNT RECOVERY</p>

        <h2>
          Reset Your
          <br />
          Password
        </h2>

        <p>
          Choose a new password to
          <br />
          secure your account.
        </p>
      </div>
    </div>


    <!-- RIGHT SECTION -->
    <div class="login-form-section">

      <!-- CONTENT -->
      <div class="login-content">

        <div class="mobile-logo">
          <app-logo></app-logo>
        </div>

        <h1>Reset password</h1>

        <p class="subtitle">
          Enter your new password below
        </p>


        <form
          class="form"
          [formGroup]="Form"
          (ngSubmit)="onSubmit()">


          <!-- NEW PASSWORD -->
          <div class="input-wrapper">

            <span class="input-icon">
              <i class="pi pi-lock"></i>
            </span>

            <p-floatlabel>

              <p-password
                name="newPassword"
                formControlName="newPassword"
                inputStyleClass="custom-password"
                inputId="new_password"
                [feedback]="false"
                [toggleMask]="true"
                autocomplete="new-password">
              </p-password>

              <label for="new_password">
                New Password
              </label>

            </p-floatlabel>

            <app-field-error [control]="Form.get('newPassword')" label="New password" />

          </div>


          <!-- CONFIRM PASSWORD -->
          <div class="input-wrapper">

            <span class="input-icon">
              <i class="pi pi-lock"></i>
            </span>

            <p-floatlabel>

              <p-password
                name="confirmPassword"
                formControlName="confirmPassword"
                inputStyleClass="custom-password"
                inputId="confirm_password"
                [feedback]="false"
                [toggleMask]="true"
                autocomplete="new-password">
              </p-password>

              <label for="confirm_password">
                Confirm Password
              </label>

            </p-floatlabel>

            <app-field-error [control]="Form.get('confirmPassword')" label="Confirm password" />

          </div>


          <!-- SUBMIT -->
          <p-button
            label="Submit"
            type="submit"
            [loading]="loading"
            styleClass="login-button">
          </p-button>


          <!-- MESSAGE -->
          <p
            class="login-error"
            [class.visible]="message"
            [class.success]="messageType === 'success'">
            {{ message }}
          </p>

        </form>

      </div>

    </div>

  </div>

</div>
